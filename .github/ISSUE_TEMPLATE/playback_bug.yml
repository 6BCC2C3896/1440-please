name: Playback bug
description: Report a 1440p stability, ramp, buffer, or quality-switching problem.
title: "[Playback] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks. Please capture the playback state rather than only saying that buffering was bad.
  - type: input
    id: firefox
    attributes:
      label: Firefox version
      placeholder: e.g. Firefox Developer Edition 157
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: 1440, Please version
      placeholder: e.g. 0.17.8
    validations:
      required: true
  - type: dropdown
    id: ramp
    attributes:
      label: Ramp profile
      options: [Defensive, Aggressive]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include Quality, Stage, approximate buffer seconds, and whether this occurred at startup, ramp-up, or after stable 1440p.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional observations
      description: Video URL is optional. Avoid sharing account/private information.
